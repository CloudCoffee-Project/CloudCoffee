name: Mobile CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detecta si el PR toca mobile/. Se ejecuta siempre para que el job gate de
  # abajo siempre pueda decidir, incluso en PRs que solo cambian backend.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter consulta la API de GitHub para listar los archivos del PR,
    # por eso este job necesita pull-requests: read además de contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Evaluar archivos modificados
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'

  quality:
    name: Typecheck, lint, tests and web export
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --ci --coverage=false

      - name: Build web bundle
        env:
          # Variables EXPO_PUBLIC_* se hornean dentro del bundle: nunca pongas
          # secretos acá. Solo la URL pública del gateway.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web --output-dir /tmp/expo-export-web

      - name: Upload web build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-export
          path: /tmp/expo-export-web
          retention-days: 3

  # Único check que debe marcarse como required. Corre siempre y es el único
  # que GitHub ve en todos los PRs, incluidos los que no tocan mobile/.
  gate:
    name: Compuerta CI
    needs: [changes, quality]
    # always() es necesario para que el gate evalúe el resultado aunque
    # quality haya fallado o sido omitido.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultado de los jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          case "$QUALITY_RESULT" in
            success)
              echo "OK: las verificaciones de mobile pasaron."
              ;;
            skipped)
              echo "OK: el PR no modifica mobile/, no hay nada que verificar."
              ;;
            failure)
              echo "::error::Fallaron las verificaciones de mobile."
              exit 1
              ;;
            cancelled)
              echo "::error::Las verificaciones de mobile fueron canceladas."
              exit 1
              ;;
            *)
              echo "::error::Resultado inesperado: $QUALITY_RESULT"
              exit 1
              ;;
          esac
