name: Build and deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth-service,         target: auth-runtime }
          - { service: catalog-service,      target: service-runtime }
          - { service: order-service,        target: service-runtime }
          - { service: notification-service, target: service-runtime }
          - { service: api-gateway,          target: service-runtime }
          - { service: payment-service,    target: service-runtime }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: ${{ matrix.target }}
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/cloudcoffee-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Redeploy en Kubero
        run: |
          curl -sf -o /dev/null -w "${{ matrix.service }}: %{http_code}\n" -X GET \
            "https://kubero.inf.uct.cl/api/apps/cloudcoffee/production/${{ matrix.service }}/restart" \
            -H "Authorization: Bearer ${{ secrets.KUBERO_TOKEN }}"