spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    # Las cuentas de prueba (perfil dev) son una migración repetible; si una base
    # que las cargó arranca sin ese perfil, la validación no debe fallar.
    ignore-migration-patterns: "*:future,repeatable:missing"
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Servicio de autenticación de CloudCoffee
