# Solo para pruebas: Spring Boot carga este archivo además de classpath:/application.yml.
# Las pruebas no deben depender de un colector Zipkin real en localhost:9411.
management:
  tracing:
    export:
      enabled: false
spring:
  datasource:
    hikari:
      # Spring cachea cada contexto de prueba distinto junto con su pool. Con el pool por defecto (10 fijas)
      # una docena de contextos agota los 100 clientes de PostgreSQL en CI ("too many clients already").
      # 6 cubre las pruebas de concurrencia (hasta 4 hilos) y los pools inactivos bajan a 1 conexión.
      maximum-pool-size: 6
      minimum-idle: 1
      idle-timeout: 10000
