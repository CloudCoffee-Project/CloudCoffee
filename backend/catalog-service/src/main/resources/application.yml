spring:
  application:
    name: catalog-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Servicio de catálogo de CloudCoffee
