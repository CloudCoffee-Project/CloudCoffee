spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: catalog-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    # El seed de desarrollo (perfil dev) es repetible; si una base que lo cargó
    # arranca sin ese perfil, la validación no debe fallar por no encontrarlo.
    ignore-migration-patterns: "*:future,repeatable:missing"

catalog:
  outbox:
    publish-enabled: ${CATALOG_OUTBOX_PUBLISH_ENABLED:true}
    publish-ms: ${CATALOG_OUTBOX_PUBLISH_MS:2000}
  reservations:
    ttl: ${CATALOG_RESERVATION_TTL:PT5M}
    expiration-scan-ms: ${CATALOG_RESERVATION_EXPIRATION_SCAN_MS:30000}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Servicio de catálogo de CloudCoffee
