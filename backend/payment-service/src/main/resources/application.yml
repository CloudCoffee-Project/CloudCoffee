spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    # Las compras de prueba (perfil dev) son una migración repetible; si una base
    # que las cargó arranca sin ese perfil, la validación no debe fallar.
    ignore-migration-patterns: "*:future,repeatable:missing"

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Servicio de pagos sandbox de CloudCoffee

server:
  port: ${PAYMENT_SERVICE_PORT:18085}

cloudcoffee:
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
    request-timeout: ${PAYMENT_REQUEST_TIMEOUT:PT5S}
    signature-tolerance: ${PAYMENT_SIGNATURE_TOLERANCE:PT5M}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    webhook-public-url: ${PAYMENT_WEBHOOK_PUBLIC_URL:}
    web-return-url: ${PAYMENT_WEB_RETURN_URL:}
    mobile-return-url: ${PAYMENT_MOBILE_RETURN_URL:}
    # INT2-111: test-user (init_point) o test-credentials (sandbox_init_point); debe coincidir con la credencial.
    checkout-mode: ${PAYMENT_CHECKOUT_MODE:}
    mercadopago-api-url: ${MERCADOPAGO_API_URL:https://api.mercadopago.com}
    # Tras un POST ambiguo al proveedor, solo se vuelve a crear si la búsqueda sigue vacía pasado este plazo.
    reconciliation-settle-time: ${PAYMENT_RECONCILIATION_SETTLE_TIME:PT1M}
    # INT2-112: inbox de webhooks, conciliación periódica con el proveedor y outbox de eventos.
    processing:
      enabled: ${PAYMENT_PROCESSING_ENABLED:true}
      poll-interval: ${PAYMENT_POLL_INTERVAL:PT5S}
      # Consulta al proveedor de cada intención abierta aunque no lleguen notificaciones.
      reconciliation-interval: ${PAYMENT_RECONCILIATION_INTERVAL:PT2M}
      # Sin respuesta del proveedor, la intención vence igual pasado este margen tras expiraAt.
      expiry-grace: ${PAYMENT_EXPIRY_GRACE:PT5M}
      # Tiempo tras el vencimiento durante el que se siguen buscando aprobaciones tardías.
      late-approval-window: ${PAYMENT_LATE_APPROVAL_WINDOW:P3D}
      max-attempts: ${PAYMENT_MAX_ATTEMPTS:12}
      retry-backoff: ${PAYMENT_RETRY_BACKOFF:PT10S}
      max-backoff: ${PAYMENT_MAX_BACKOFF:PT15M}
      lease: ${PAYMENT_PROCESSING_LEASE:PT1M}
