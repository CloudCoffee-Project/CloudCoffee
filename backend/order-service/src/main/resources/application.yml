spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # INT2-113: consumidor de payment.pago.resultado.v1. Un fallo no se reencola indefinidamente: tras los
    # reintentos va a order.payment-results.dlq (la conciliación con Payment cubre ese resultado).
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  application:
    name: order-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    # Las compras de prueba (perfil dev) son una migración repetible; si una base
    # que las cargó arranca sin ese perfil, la validación no debe fallar.
    ignore-migration-patterns: "*:future,repeatable:missing"

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Servicio de pedidos de CloudCoffee

cloudcoffee:
  pagos:
    # INT2-113: "simulado" (por defecto, contrato INT2-50 con escenarios) o "mercadopago_sandbox"
    # (checkout de payment-service; sin escenarios ni otro proveedor de respaldo).
    provider: ${ORDER_PAYMENT_PROVIDER:simulado}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:18085}
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:PT5S}
    # Consulta a Payment de pagos externos abiertos aunque se pierdan eventos.
    reconciliation-interval: ${ORDER_PAYMENT_RECONCILIATION_INTERVAL:PT2M}
    late-approval-window: ${ORDER_PAYMENT_LATE_APPROVAL_WINDOW:P3D}
    consumer-enabled: ${ORDER_PAYMENT_CONSUMER_ENABLED:true}
