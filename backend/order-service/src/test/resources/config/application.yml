# Solo para pruebas: Spring Boot carga este archivo además de classpath:/application.yml.
# Las pruebas no dependen de RabbitMQ ni de Zipkin, y el vencimiento de reservas se
# ejecuta a mano para controlar el instante.
management:
  health:
    rabbit:
      enabled: false
  tracing:
    export:
      enabled: false
cloudcoffee:
  reservas:
    expiracion:
      enabled: false
