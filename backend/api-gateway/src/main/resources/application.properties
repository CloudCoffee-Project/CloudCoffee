spring.application.name=api-gateway
server.port=${API_GATEWAY_PORT:18080}

# La autenticacion JWT se implementa en INT2-14; no generar un usuario local.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Docker proporciona estas URLs; los valores por defecto usan los puertos locales publicados.
# StripPrefix=1 elimina solo /v1 y conserva el contrato interno de cada servicio.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-v1
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:18081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/v1/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-v1
spring.cloud.gateway.server.webmvc.routes[1].uri=${CATALOG_SERVICE_URL:http://localhost:18082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/v1/catalog/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=notifications-v1
spring.cloud.gateway.server.webmvc.routes[2].uri=${NOTIFICATION_SERVICE_URL:http://localhost:18084}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/v1/notifications/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
